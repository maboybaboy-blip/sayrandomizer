<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Say-Randomizer | Рандомайзер + Трекер</title>
    
    <!-- ===== FAVICON ===== -->

<body>
    <!-- ... весь HTML код остаётся без изменений ... -->
    
    <script>
        (function() {
            // =============================================
            //  🔑 КЛЮЧИ
            // =============================================
            const YOUTUBE_API_KEY = window.__ENV?.YOUTUBE_API_KEY || 'AIzaSyB8wJjFBOdz6VS0tZBGMy71jBCx_WCdmas';
            const HCAPTCHA_SITE_KEY = window.__ENV?.HCAPTCHA_SITE_KEY || '56a8a9d6-8f22-4e0a-ae40-d6a6e0148860';
            // =============================================

            const APP_NAME = 'Say-Randomizer';
            let hcaptchaReady = false;
            let hcaptchaToken = null;
            let hcaptchaWidgetId = null;
            let selectedWinnersCount = 1;
            let lastWinners = [];

            // =============================================
            //  ФУНКЦИЯ ФОРМАТИРОВАНИЯ ЧИСЕЛ
            // =============================================
            function formatNumber(num) {
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            }

            // =============================================
            //  ГЕНЕРАЦИЯ АВАТАРКИ (ЛОКАЛЬНО)
            // =============================================
            function getInitials(name) {
                if (!name) return '?';
                const clean = name.trim();
                if (!clean) return '?';
                const parts = clean.split(' ');
                if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
                return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
            }

            function getAvatarColor(name) {
                let hash = 0;
                for (let i = 0; i < name.length; i++) {
                    hash = name.charCodeAt(i) + ((hash << 5) - hash);
                }
                const hue = Math.abs(hash) % 360;
                return `hsl(${hue}, 75%, 55%)`;
            }

            function getAvatarGradient(name) {
                const color1 = getAvatarColor(name);
                const color2 = getAvatarColor(name + 'salt');
                return `linear-gradient(135deg, ${color1}, ${color2})`;
            }

            // =============================================
            //  СОЗДАНИЕ АВАТАРКИ В DOM
            // =============================================
            function createAvatarElement(name, container, isScreenshot = false) {
                const initials = getInitials(name);
                const gradient = getAvatarGradient(name);
                
                // Очищаем контейнер
                container.innerHTML = '';
                
                // Создаём элемент аватара
                const avatar = document.createElement('div');
                avatar.className = isScreenshot ? 'sw-avatar' : 'winner-avatar';
                avatar.style.background = gradient;
                avatar.style.width = isScreenshot ? '40px' : '44px';
                avatar.style.height = isScreenshot ? '40px' : '44px';
                avatar.style.borderRadius = '50%';
                avatar.style.display = 'flex';
                avatar.style.alignItems = 'center';
                avatar.style.justifyContent = 'center';
                avatar.style.flexShrink = '0';
                avatar.style.overflow = 'hidden';
                
                // Добавляем инициалы
                const initialsSpan = document.createElement('span');
                initialsSpan.className = isScreenshot ? '' : 'w-initials';
                initialsSpan.textContent = initials;
                initialsSpan.style.fontSize = isScreenshot ? '14px' : '16px';
                initialsSpan.style.fontWeight = '700';
                initialsSpan.style.color = '#fff';
                initialsSpan.style.textShadow = '0 2px 8px rgba(0,0,0,0.3)';
                
                avatar.appendChild(initialsSpan);
                container.appendChild(avatar);
            }

            // =============================================
            //  ВЫБОР КОЛИЧЕСТВА ПОБЕДИТЕЛЕЙ
            // =============================================
            const winnerBtns = document.querySelectorAll('.winner-btn');
            winnerBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    winnerBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedWinnersCount = parseInt(this.dataset.count);
                });
            });

            // =============================================
            //  hCaptcha
            // =============================================
            const hcaptchaDot = document.getElementById('hcaptchaDot');
            const hcaptchaStatus = document.getElementById('hcaptchaStatus');

            function updateHcaptchaStatus(status, message) {
                if (hcaptchaDot) {
                    hcaptchaDot.className = 'hcaptcha-dot ' + status;
                }
                if (hcaptchaStatus) {
                    hcaptchaStatus.textContent = message;
                }
            }

            function initHcaptcha() {
                const widgetContainer = document.getElementById('hcaptcha-widget');
                widgetContainer.innerHTML = '';
                
                try {
                    if (typeof window.hcaptcha !== 'undefined') {
                        hcaptchaWidgetId = window.hcaptcha.render(widgetContainer, {
                            sitekey: HCAPTCHA_SITE_KEY,
                            theme: 'dark',
                            size: 'normal',
                            callback: function(token) {
                                hcaptchaToken = token;
                                hcaptchaReady = true;
                                updateHcaptchaStatus('verified', '✅ Проверка пройдена!');
                                hcaptchaDot.className = 'hcaptcha-dot verified';
                            },
                            'expired-callback': function() {
                                hcaptchaToken = null;
                                hcaptchaReady = false;
                                updateHcaptchaStatus('error', '❌ Токен истёк, обновите страницу');
                            },
                            'error-callback': function() {
                                updateHcaptchaStatus('error', '❌ Ошибка hCaptcha');
                            }
                        });
                        updateHcaptchaStatus('ready', '✅ Отметьте "Я не робот"');
                        hcaptchaDot.className = 'hcaptcha-dot ready';
                    } else {
                        widgetContainer.innerHTML = `
                            <div class="hcaptcha-placeholder">
                                <i class="fas fa-spinner fa-spin"></i>
                                <span>Загрузка hCaptcha...</span>
                            </div>
                        `;
                        setTimeout(initHcaptcha, 1000);
                    }
                } catch (error) {
                    console.error('Ошибка инициализации hCaptcha:', error);
                    widgetContainer.innerHTML = `
                        <div class="hcaptcha-placeholder" style="color: #ff6b6b;">
                            <i class="fas fa-exclamation-circle"></i>
                            <span>Ошибка загрузки hCaptcha. Обновите страницу.</span>
                        </div>
                    `;
                    updateHcaptchaStatus('error', '❌ Ошибка загрузки');
                }
            }

            // =============================================
            //  ВКЛАДКИ
            // =============================================
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = {
                randomizer: document.getElementById('tab-randomizer'),
                tracker: document.getElementById('tab-tracker')
            };

            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    const tab = this.dataset.tab;
                    Object.keys(tabContents).forEach(key => {
                        tabContents[key].classList.toggle('active', key === tab);
                    });
                });
            });

            // =============================================
            //  РАНДОМАЙЗЕР КОММЕНТАРИЕВ
            // =============================================
            const videoUrlInput = document.getElementById('videoUrl');
            const randomizeBtn = document.getElementById('randomizeBtn');
            const statusText = document.getElementById('statusText');
            const commentsCountSpan = document.getElementById('commentsCount');
            const videoTitleSpan = document.getElementById('videoTitle');

            const modal = document.getElementById('winnerModal');
            const winnersList = document.getElementById('winnersList');
            const winnersCountDisplay = document.getElementById('winnersCountDisplay');
            const winnerDate = document.getElementById('winnerDate');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const copyResultBtn = document.getElementById('copyResultBtn');
            const screenshotBtn = document.getElementById('screenshotBtn');
            const confettiContainer = document.getElementById('confettiContainer');

            const scrContainer = document.getElementById('screenshotContainer');
            const scrWinnersList = document.getElementById('scrWinnersList');
            const scrWinnersCount = document.getElementById('scrWinnersCount');

            let cachedComments = [];
            let videoId = '';
            let isLoading = false;

            // =============================================
            //  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
            // =============================================
            function extractVideoId(url) {
                try {
                    const urlObj = new URL(url);
                    if (urlObj.hostname.includes('youtube.com') || urlObj.hostname.includes('youtu.be')) {
                        let id = urlObj.searchParams.get('v');
                        if (!id && urlObj.hostname.includes('youtu.be')) {
                            id = urlObj.pathname.substring(1);
                        }
                        if (id && id.length === 11) return id;
                    }
                    return null;
                } catch { return null; }
            }

            function setStatus(text, isError = false, isLoadingState = false) {
                statusText.innerHTML = text;
                statusText.style.color = isError ? '#ff6b6b' : '#c0c0c0';
                if (isLoadingState) {
                    statusText.innerHTML = `<span class="spinner"></span> ${text}`;
                }
            }

            function formatDate(dateString) {
                if (!dateString) return new Date().toLocaleString('ru-RU', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
                try {
                    const date = new Date(dateString);
                    return date.toLocaleString('ru-RU', {
                        day: '2-digit', month: '2-digit', year: 'numeric',
                        hour: '2-digit', minute: '2-digit', second: '2-digit'
                    });
                } catch { return dateString; }
            }

            function createConfetti() {
                confettiContainer.innerHTML = '';
                const colors = ['#ff0033', '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bff', '#ff9f43', '#00d2d3'];
                const shapes = ['square', 'circle', 'triangle'];
                for (let i = 0; i < 60; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    const size = Math.random() * 8 + 4;
                    const shape = shapes[Math.floor(Math.random() * shapes.length)];
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.top = '-10px';
                    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.width = size + 'px';
                    piece.style.height = size + 'px';
                    if (shape === 'circle') piece.style.borderRadius = '50%';
                    else if (shape === 'triangle') {
                        piece.style.clipPath = 'polygon(50% 0%, 0% 100%, 100% 100%)';
                        piece.style.borderRadius = '0';
                    } else piece.style.borderRadius = '2px';
                    piece.style.animationDuration = (Math.random() * 2.5 + 1.5) + 's';
                    piece.style.animationDelay = (Math.random() * 1.8) + 's';
                    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                    confettiContainer.appendChild(piece);
                }
                setTimeout(() => confettiContainer.innerHTML = '', 4500);
            }

            // =============================================
            //  ПОКАЗ ПОБЕДИТЕЛЕЙ (С ЛОКАЛЬНЫМИ АВАТАРКАМИ)
            // =============================================
            function showWinnersModal(winners, count) {
                lastWinners = winners;
                const now = new Date();
                winnerDate.textContent = formatDate(now);
                winnersCountDisplay.textContent = count;

                // Очищаем списки
                winnersList.innerHTML = '';
                scrWinnersList.innerHTML = '';
                scrWinnersCount.textContent = count;

                const placeEmojis = ['🥇', '🥈', '🥉', '🏅', '🎯', '⭐', '🌟', '💫', '✨', '🎉'];

                for (let i = 0; i < winners.length; i++) {
                    const winner = winners[i];
                    const name = winner.author || 'Аноним';
                    const initials = getInitials(name);
                    const gradient = getAvatarGradient(name);
                    const placeEmoji = i < 10 ? placeEmojis[i] : `#${i + 1}`;
                    
                    // ===== СОЗДАЁМ ЭЛЕМЕНТ ДЛЯ МОДАЛКИ =====
                    const item = document.createElement('div');
                    item.className = 'winner-item';
                    item.style.animationDelay = `${i * 0.1}s`;
                    
                    // Контейнер для аватара
                    const avatarContainer = document.createElement('div');
                    avatarContainer.className = 'winner-avatar';
                    avatarContainer.style.background = gradient;
                    avatarContainer.style.width = '44px';
                    avatarContainer.style.height = '44px';
                    avatarContainer.style.borderRadius = '50%';
                    avatarContainer.style.display = 'flex';
                    avatarContainer.style.alignItems = 'center';
                    avatarContainer.style.justifyContent = 'center';
                    avatarContainer.style.flexShrink = '0';
                    avatarContainer.style.overflow = 'hidden';
                    
                    const initialsSpan = document.createElement('span');
                    initialsSpan.className = 'w-initials';
                    initialsSpan.textContent = initials;
                    initialsSpan.style.fontSize = '16px';
                    initialsSpan.style.fontWeight = '700';
                    initialsSpan.style.color = '#fff';
                    initialsSpan.style.textShadow = '0 2px 8px rgba(0,0,0,0.3)';
                    avatarContainer.appendChild(initialsSpan);
                    
                    // Собираем элемент
                    item.innerHTML = `
                        <div class="winner-place">${placeEmoji}</div>
                        <div class="winner-info">
                            <div class="winner-name">${name}</div>
                            <div class="winner-comment">${winner.text || '—'}</div>
                        </div>
                        <div class="winner-likes">
                            <i class="fas fa-heart"></i> ${winner.likes || 0}
                        </div>
                    `;
                    
                    // Вставляем аватар на место
                    const placeElement = item.querySelector('.winner-place');
                    placeElement.after(avatarContainer);
                    
                    winnersList.appendChild(item);

                    // ===== СОЗДАЁМ ЭЛЕМЕНТ ДЛЯ СКРИНШОТА =====
                    const scrItem = document.createElement('div');
                    scrItem.className = 'scr-winner-item';
                    
                    const scrAvatarContainer = document.createElement('div');
                    scrAvatarContainer.className = 'sw-avatar';
                    scrAvatarContainer.style.background = gradient;
                    scrAvatarContainer.style.width = '40px';
                    scrAvatarContainer.style.height = '40px';
                    scrAvatarContainer.style.borderRadius = '50%';
                    scrAvatarContainer.style.display = 'flex';
                    scrAvatarContainer.style.alignItems = 'center';
                    scrAvatarContainer.style.justifyContent = 'center';
                    scrAvatarContainer.style.flexShrink = '0';
                    scrAvatarContainer.style.overflow = 'hidden';
                    
                    const scrInitialsSpan = document.createElement('span');
                    scrInitialsSpan.textContent = initials;
                    scrInitialsSpan.style.fontSize = '14px';
                    scrInitialsSpan.style.fontWeight = '700';
                    scrInitialsSpan.style.color = '#fff';
                    scrInitialsSpan.style.textShadow = '0 2px 8px rgba(0,0,0,0.3)';
                    scrAvatarContainer.appendChild(scrInitialsSpan);
                    
                    scrItem.innerHTML = `
                        <div class="sw-place">${placeEmoji}</div>
                        <div class="sw-info">
                            <div class="sw-name">${name}</div>
                            <div class="sw-comment">${winner.text || '—'}</div>
                        </div>
                    `;
                    
                    const scrPlaceElement = scrItem.querySelector('.sw-place');
                    scrPlaceElement.after(scrAvatarContainer);
                    
                    scrWinnersList.appendChild(scrItem);
                }

                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
                setTimeout(createConfetti, 150);
            }

            function closeModal() {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }

            // =============================================
            //  КОПИРОВАНИЕ РЕЗУЛЬТАТА
            // =============================================
            function copyResult() {
                if (lastWinners.length === 0) return;
                
                let text = `🏆 ПОБЕДИТЕЛИ КОНКУРСА (${lastWinners.length})\n\n`;
                const placeEmojis = ['🥇', '🥈', '🥉', '🏅', '🎯', '⭐', '🌟', '💫', '✨', '🎉'];
                
                lastWinners.forEach((w, i) => {
                    const place = i < 10 ? placeEmojis[i] : `#${i + 1}`;
                    text += `${place} ${w.author || 'Аноним'}\n   "${w.text || '—'}"\n   ❤️ ${w.likes || 0}\n\n`;
                });
                
                text += `📅 ${formatDate(new Date())}\n\nrandomized by Say-Randomizer\nЗащищено hCaptcha`;
                
                navigator.clipboard.writeText(text).then(() => {
                    copyResultBtn.innerHTML = '<i class="fas fa-check"></i> Скопировано!';
                    setTimeout(() => copyResultBtn.innerHTML = '<i class="fas fa-copy"></i> Копировать', 2000);
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    copyResultBtn.innerHTML = '<i class="fas fa-check"></i> Скопировано!';
                    setTimeout(() => copyResultBtn.innerHTML = '<i class="fas fa-copy"></i> Копировать', 2000);
                });
            }

            // =============================================
            //  СКРИНШОТ
            // =============================================
            async function downloadScreenshot() {
                if (lastWinners.length === 0) {
                    alert('Сначала выберите победителей!');
                    return;
                }

                try {
                    screenshotBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Генерация...';
                    screenshotBtn.disabled = true;

                    scrContainer.style.left = '0';
                    scrContainer.style.top = '0';
                    scrContainer.style.position = 'fixed';
                    scrContainer.style.zIndex = '9999';

                    await new Promise(resolve => setTimeout(resolve, 300));

                    const canvas = await html2canvas(scrContainer, {
                        scale: 2,
                        backgroundColor: null,
                        useCORS: true,
                        logging: false,
                        allowTaint: true,
                        width: scrContainer.scrollWidth,
                        height: scrContainer.scrollHeight,
                    });

                    scrContainer.style.left = '-9999px';
                    scrContainer.style.position = 'fixed';

                    const link = document.createElement('a');
                    const timestamp = Date.now();
                    link.download = `sayrandomizer-winners_${timestamp}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    screenshotBtn.innerHTML = '<i class="fas fa-check"></i> Готово!';
                    setTimeout(() => {
                        screenshotBtn.innerHTML = '<i class="fas fa-camera"></i> Скриншот';
                        screenshotBtn.disabled = false;
                    }, 2000);

                } catch (error) {
                    console.error('Ошибка создания скриншота:', error);
                    alert('Не удалось создать скриншот. Попробуйте ещё раз.');
                    screenshotBtn.innerHTML = '<i class="fas fa-camera"></i> Скриншот';
                    screenshotBtn.disabled = false;
                    scrContainer.style.left = '-9999px';
                }
            }

            // =============================================
            //  YOUTUBE API
            // =============================================
            async function fetchCommentsWithAPI(videoId) {
                const videoResponse = await fetch(
                    `https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${videoId}&key=${YOUTUBE_API_KEY}`
                );
                if (!videoResponse.ok) {
                    const error = await videoResponse.json();
                    throw new Error(`Ошибка API: ${error.error?.message || videoResponse.statusText}`);
                }
                const videoData = await videoResponse.json();
                if (!videoData.items || videoData.items.length === 0) {
                    throw new Error('Видео не найдено.');
                }
                const videoTitle = videoData.items[0].snippet.title;

                let allComments = [];
                let nextPageToken = null;
                let attempts = 0;
                const maxAttempts = 10;

                do {
                    attempts++;
                    let url = `https://www.googleapis.com/youtube/v3/commentThreads?part=snippet&videoId=${videoId}&maxResults=100&key=${YOUTUBE_API_KEY}`;
                    if (nextPageToken) url += `&pageToken=${nextPageToken}`;

                    const response = await fetch(url);
                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(`Ошибка API: ${error.error?.message || response.statusText}`);
                    }

                    const data = await response.json();
                    if (data.items) {
                        for (const item of data.items) {
                            const snippet = item.snippet.topLevelComment.snippet;
                            allComments.push({
                                text: snippet.textDisplay,
                                author: snippet.authorDisplayName,
                                likes: snippet.likeCount,
                                publishedAt: snippet.publishedAt,
                                channelId: snippet.authorChannelId?.value || null
                            });
                        }
                    }
                    nextPageToken = data.nextPageToken || null;
                    if (attempts > maxAttempts) break;
                } while (nextPageToken);

                if (allComments.length === 0) throw new Error('Под видео нет комментариев.');
                return { comments: allComments, videoTitle, total: allComments.length };
            }

            // =============================================
            //  ОСНОВНОЙ ОБРАБОТЧИК
            // =============================================
            async function handleRandomize() {
                if (isLoading) return;
                
                if (!hcaptchaReady || !hcaptchaToken) {
                    setStatus('⏳ Пожалуйста, пройдите проверку "Я не робот"', false, true);
                    updateHcaptchaStatus('loading', '⏳ Ожидание проверки...');
                    return;
                }

                if (!YOUTUBE_API_KEY || !YOUTUBE_API_KEY.startsWith('AIza')) {
                    setStatus('⚠️ API-ключ неверный. Проверь код.', true);
                    return;
                }

                const url = videoUrlInput.value.trim();
                if (!url) {
                    setStatus('⚠️ Введите ссылку на видео.', true);
                    return;
                }

                const id = extractVideoId(url);
                if (!id) {
                    setStatus('❌ Неверная ссылка YouTube.', true);
                    return;
                }

                if (videoId !== id) {
                    videoId = id;
                    cachedComments = [];
                    commentsCountSpan.textContent = 'Комментариев: —';
                    videoTitleSpan.textContent = 'Название: —';
                }

                if (cachedComments.length > 0) {
                    pickWinners();
                    return;
                }

                isLoading = true;
                randomizeBtn.disabled = true;
                setStatus('⏳ Загружаем комментарии...', false, true);

                try {
                    const data = await fetchCommentsWithAPI(id);
                    cachedComments = data.comments;
                    videoTitleSpan.textContent = data.videoTitle.substring(0, 50) + (data.videoTitle.length > 50 ? '…' : '');
                    commentsCountSpan.textContent = `Комментариев: ${data.total}`;
                    if (cachedComments.length === 0) {
                        setStatus('😕 Под этим видео нет комментариев.', true);
                        isLoading = false;
                        randomizeBtn.disabled = false;
                        return;
                    }
                    pickWinners();
                    setStatus(`✅ Загружено ${cachedComments.length} комментариев. Победители выбраны!`);
                } catch (error) {
                    let errorMsg = error.message || 'Неизвестная ошибка';
                    if (errorMsg.includes('API key')) errorMsg = 'Неверный API-ключ.';
                    else if (errorMsg.includes('quota')) errorMsg = 'Превышена квота API. Попробуй позже.';
                    else if (errorMsg.includes('commentsDisabled')) errorMsg = 'Комментарии отключены.';
                    setStatus(`❌ ${errorMsg}`, true);
                    cachedComments = [];
                } finally {
                    isLoading = false;
                    randomizeBtn.disabled = false;
                }
            }

            function pickWinners() {
                if (cachedComments.length === 0) {
                    setStatus('⚠️ Нет комментариев.', true);
                    return;
                }

                const shuffled = [...cachedComments].sort(() => Math.random() - 0.5);
                const count = Math.min(selectedWinnersCount, shuffled.length);
                const winners = shuffled.slice(0, count);

                showWinnersModal(winners, count);
                setStatus(`🎉 Выбрано ${count} победителей из ${cachedComments.length} комментариев!`);
            }

            // =============================================
            //  СОБЫТИЯ
            // =============================================
            randomizeBtn.addEventListener('click', handleRandomize);
            closeModalBtn.addEventListener('click', closeModal);
            copyResultBtn.addEventListener('click', copyResult);
            screenshotBtn.addEventListener('click', downloadScreenshot);
            
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
            videoUrlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); randomizeBtn.click(); } });

            // =============================================
            //  ИНИЦИАЛИЗАЦИЯ
            // =============================================
            setTimeout(initHcaptcha, 1000);

            // =============================================
            //  ТРЕКЕР ПОДПИСЧИКОВ
            // =============================================
            const youtubeChannelInput = document.getElementById('youtubeChannelInput');
            const trackYoutubeBtn = document.getElementById('trackYoutubeBtn');
            const youtubeSubCount = document.getElementById('youtubeSubCount');
            const trackerStatus = document.getElementById('trackerStatus');
            const trackerLastUpdate = document.getElementById('trackerLastUpdate');
            const trackerUpdates = document.getElementById('trackerUpdates');
            const currentChannelName = document.getElementById('currentChannelName');

            let youtubeInterval = null;
            let lastSubCount = 0;
            let isTracking = false;
            let trackerUpdateCount = 0;

            function setTrackerStatus(text, isError = false, isLoadingState = false) {
                trackerStatus.innerHTML = text;
                trackerStatus.style.color = isError ? '#ff6b6b' : '#c0c0c0';
                if (isLoadingState) {
                    trackerStatus.innerHTML = `<span class="spinner"></span> ${text}`;
                }
            }

            function getChannelIdByName(channelName) {
                const popularChannels = {
                    'linustechtips': 'UCXuqSBlHAE6Xw-yeJA0Tunw',
                    'mrbeast': 'UCX6OQ3DkcsbYNE6H8uQQuVA',
                    'pewdiepie': 'UC-lHJZR3Gqxm24_Vd_AJ5Yw',
                    'dudeperfect': 'UC7Y3cI8gUPBlnDNo91EsnJQ',
                    'markiplier': 'UC7_YxT-KID8kRbqZo7MyscQ',
                    'jacksepticeye': 'UCYzPXprvl5Y-Sf0g4vX-m6g'
                };

                if (popularChannels[channelName.toLowerCase()]) {
                    return Promise.resolve(popularChannels[channelName.toLowerCase()]);
                }

                return fetch(
                    `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(channelName)}&type=channel&key=${YOUTUBE_API_KEY}`
                )
                .then(response => {
                    if (!response.ok) throw new Error(`Ошибка поиска: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    if (!data.items || data.items.length === 0) {
                        throw new Error('Канал не найден');
                    }
                    return data.items[0].snippet.channelId;
                });
            }

            async function fetchYoutubeSubs() {
                const input = youtubeChannelInput.value.trim() || 'linustechtips';
                
                setTrackerStatus('Загрузка...', false, true);
                
                try {
                    const channelId = await getChannelIdByName(input);
                    
                    const channelResponse = await fetch(
                        `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${channelId}&key=${YOUTUBE_API_KEY}`
                    );
                    
                    if (!channelResponse.ok) {
                        throw new Error(`Ошибка получения канала: ${channelResponse.status}`);
                    }
                    
                    const channelData = await channelResponse.json();
                    
                    if (!channelData.items || channelData.items.length === 0) {
                        throw new Error('Канал не найден');
                    }
                    
                    const channel = channelData.items[0];
                    const channelName = channel.snippet.title;
                    const count = parseInt(channel.statistics.subscriberCount) || 0;
                    
                    currentChannelName.textContent = channelName;
                    
                    if (count === 0) {
                        throw new Error('У канала нет подписчиков');
                    }
                    
                    updateSubCount(count);
                    
                    const now = new Date();
                    trackerLastUpdate.textContent = `Последнее обновление: ${now.toLocaleTimeString()}`;
                    trackerUpdateCount++;
                    trackerUpdates.textContent = `Обновлений: ${trackerUpdateCount}`;
                    setTrackerStatus('Отслеживание активно ✅');
                    
                } catch (error) {
                    console.warn('Ошибка YouTube API:', error);
                    setTrackerStatus(`⚠️ ${error.message || 'Не удалось получить данные'}`, true);
                }
            }

            function updateSubCount(newCount) {
                const oldCount = lastSubCount;
                const diff = newCount - oldCount;
                lastSubCount = newCount;
                
                const formatted = formatNumber(newCount);
                youtubeSubCount.textContent = formatted;
                
                if (oldCount > 0 && diff > 0) {
                    youtubeSubCount.className = 'counter-number pop-green';
                    setTimeout(() => {
                        youtubeSubCount.className = 'counter-number';
                    }, 600);
                    
                    const diffFormatted = formatNumber(diff);
                    showSubNotification(`+${diffFormatted} новый подписчик! (${formatted})`);
                } else if (oldCount > 0 && diff < 0) {
                    youtubeSubCount.className = 'counter-number pop';
                    setTimeout(() => {
                        youtubeSubCount.className = 'counter-number';
                    }, 600);
                }
            }

            function showSubNotification(message) {
                const notif = document.getElementById('subNotification');
                const name = document.getElementById('newSubName');
                name.textContent = message;
                notif.classList.add('show');
                setTimeout(() => {
                    notif.classList.remove('show');
                }, 5000);
            }

            function closeSubNotification() {
                document.getElementById('subNotification').classList.remove('show');
            }

            function startYoutubeTracking() {
                if (isTracking) {
                    clearInterval(youtubeInterval);
                }
                
                fetchYoutubeSubs();
                youtubeInterval = setInterval(fetchYoutubeSubs, 15000);
                isTracking = true;
                
                trackYoutubeBtn.innerHTML = '<i class="fas fa-stop"></i> Остановить';
                trackYoutubeBtn.className = 'btn-youtube stop';
                
                setTrackerStatus('Отслеживание активно...');
            }

            function stopYoutubeTracking() {
                if (youtubeInterval) {
                    clearInterval(youtubeInterval);
                    youtubeInterval = null;
                }
                isTracking = false;
                trackYoutubeBtn.innerHTML = '<i class="fas fa-play"></i> Отслеживать';
                trackYoutubeBtn.className = 'btn-youtube';
                setTrackerStatus('Остановлено');
            }

            trackYoutubeBtn.addEventListener('click', function() {
                if (isTracking) {
                    stopYoutubeTracking();
                } else {
                    startYoutubeTracking();
                }
            });

            youtubeChannelInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (isTracking) {
                        stopYoutubeTracking();
                    }
                    startYoutubeTracking();
                }
            });

            console.log('🎯 Say-Randomizer загружен!');
            console.log('🔑 API Key:', YOUTUBE_API_KEY ? '✅ установлен' : '❌ не установлен');
            console.log('🛡️ hCaptcha ключ:', HCAPTCHA_SITE_KEY ? '✅ установлен' : '❌ не установлен');

            setTimeout(() => {
                startYoutubeTracking();
            }, 500);
        })();
    </script>
</body>
</html>
